name: Validate and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - agent/react-ui-refactor
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type, lint and unit checks
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build Pages artifact
        run: |
          npm run build
          npm run check:artifact

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility
        run: npm run test:e2e -- --project=desktop-chromium

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
